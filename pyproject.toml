[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openclaw-cron-replay"
version = "0.1.0"
description = "Replay OpenClaw cron job payloads, prompts, results, and delivery decisions locally."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "OpenClaw cron replay contributors" }
]
keywords = ["openclaw", "cron", "debugging", "cli", "replay"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
openclaw-cron-replay = "openclaw_cron_replay.cli:main"

[project.urls]
Homepage = "https://github.com/pfrederiksen/openclaw-cron-replay"
Issues = "https://github.com/pfrederiksen/openclaw-cron-replay/issues"
Source = "https://github.com/pfrederiksen/openclaw-cron-replay"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_cron_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
